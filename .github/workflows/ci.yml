name: Workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-test.txt
      - name: Install pinned verification tools
        run: pip install -r apps/api/requirements-test.txt
      - name: Lint Python sources and checks
        run: ruff check apps/api/app apps/api/tests docs/testing infra/tests
      - name: Verify typed ports and adapters
        run: |
          mypy --strict --python-version 3.12 apps/api/app/ports.py apps/api/app/adapters/gemini.py apps/api/app/adapters/postgres_runs.py apps/api/tests/typed_provider_fakes.py
          python docs/testing/check_boundaries.py
      - name: Validate API, domain, and requirement contracts
        run: |
          python docs/testing/check_openapi.py
          python docs/testing/check_domain.py
          python docs/testing/check_coverage.py
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize ephemeral local secrets
        run: infra/scripts/init-local.sh
      - name: Verify local bootstrap preflight
        run: python3 -m unittest infra/tests/test_local_bootstrap.py
      - name: Verify vanilla PostgreSQL migrations
        run: docker compose --profile vanilla-test up --build --abort-on-container-exit --exit-code-from migrate-vanilla migrate-vanilla
      - name: Build and start the workspace
        run: docker compose up --build --wait web
      - name: Exercise the PostgreSQL integration suite
        run: docker compose run --build --rm tests
      - name: Verify the versioned API
        run: |
          docker compose exec -T api python -m app.openapi > /tmp/hub-openapi.json
          diff contracts/openapi.json /tmp/hub-openapi.json
      - name: Test the public entry point
        run: |
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/v1/health
      - name: Run browser and recovery journeys
        env:
          COMPOSE_PROJECT_NAME: aihub-drill-ci
          HUB_PORT: 18081
          PUBLIC_BASE_URL: http://localhost:18081
        run: |
          docker compose up --build --wait web
          npm ci --prefix apps/web
          node apps/web/tests/workspace.mjs
          infra/scripts/rehearse.sh
